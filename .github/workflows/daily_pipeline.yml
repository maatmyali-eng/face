name: FACE Daily Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'utils/**'
      - 'prompts/**'
      - 'config.yml'
      - 'requirements.txt'
  schedule:
    - cron: '0 3 * * *'   # 9 AM Bangladesh time (UTC+6) = 03:00 UTC
    - cron: '0 7 * * *'   # 1 PM Bangladesh time = 07:00 UTC
    - cron: '0 14 * * *'  # 8 PM Bangladesh time = 14:00 UTC
  workflow_dispatch: {}    # Manual launch publishes one ready item immediately

concurrency:
  group: face-daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    name: Run FACE Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      # ── Step 1: Checkout repository ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 2: Set up Python 3.11 ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Cache pip packages ────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      # ── Step 4: Install system dependencies ──────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            libsm6 \
            libxext6 \
            libfontconfig1 \
            libglib2.0-0 \
            libgl1 \
            fonts-noto \
            fonts-noto-extra

      # ── Step 5: Install Python dependencies ──────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── Step 6: Cache FACE assets (fonts, audio — never re-download) ─────
      - name: Cache FACE assets
        uses: actions/cache@v4
        with:
          path: assets/
          key: face-assets-${{ hashFiles('config.yml') }}
          restore-keys: |
            face-assets-

      # ── Step 7: Restore state from state branch ───────────────────────────
      - name: Restore state from state branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git checkout origin/state -- state/ 2>/dev/null || true
          else
            echo "State branch does not exist yet; initializing empty state."
          fi
          mkdir -p state/logs state/.locks state/prompt_versions \
                   state/pexels_cache state/schema
          echo "State restored or initialized."

      # ── Step 8: Run TrendHunterAgent ─────────────────────────────────────
      - name: Run TrendHunterAgent
        run: python agents/trend_hunter.py

      # ── Step 9: Run ContentStrategyAgent ─────────────────────────────────
      - name: Run ContentStrategyAgent
        run: python agents/content_strategy.py

      # ── Step 10: Run ContentGeneratorAgent ───────────────────────────────
      - name: Run ContentGeneratorAgent
        run: python agents/content_generator.py

      # ── Step 11: Run VisualDirectorAgent ─────────────────────────────────
      - name: Run VisualDirectorAgent
        run: python agents/visual_director.py

      # ── Step 12: Check if reels are scheduled today ───────────────────────
      - name: Check if reels are scheduled today
        id: check-reels
        run: |
          python - <<'EOF'
          import json, os, sys
          try:
              with open('state/content_plan.json') as f:
                  plan = json.load(f)
              reels = [r for r in plan.get('reels', []) if r]
              result = 'true' if reels else 'false'
          except (FileNotFoundError, json.JSONDecodeError, KeyError):
              result = 'false'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'HAS_REELS={result}\n')
          print(f'HAS_REELS={result}')
          EOF

      # ── Step 13: Run ReelProducerAgent (only if reels exist) ──────────────
      - name: Run ReelProducerAgent
        if: env.HAS_REELS == 'true'
        run: python agents/reel_producer.py

      # ── Step 14: Run PublisherAgent ───────────────────────────────────────
      # NOTE: publisher.py exits 0 on token expiry — this is intentional.
      - name: Run PublisherAgent
        if: ${{ env.FB_PAGE_ACCESS_TOKEN != '' && env.FB_PAGE_ID != '' }}
        env:
          ENABLE_FACEBOOK_PUBLISHING: 'true'
          PUBLISH_NOW: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || 'false' }}
        run: python agents/publisher.py

      - name: Publisher skipped - missing Facebook credentials
        if: ${{ env.FB_PAGE_ACCESS_TOKEN == '' || env.FB_PAGE_ID == '' }}
        run: |
          echo "::warning::Publisher skipped because FB_PAGE_ACCESS_TOKEN or FB_PAGE_ID is not configured."

      - name: Commit and push persistent state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/face-state
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git worktree add --detach /tmp/face-state origin/state
          else
            echo "Creating the initial state branch from this revision."
            git worktree add --detach /tmp/face-state HEAD
            rm -rf /tmp/face-state/state
            mkdir -p /tmp/face-state/state
          fi

          mkdir -p /tmp/face-state/state
          if [ -d state ]; then
            cp -a state/. /tmp/face-state/state/
          fi

          cd /tmp/face-state
          # /state is intentionally gitignored on main; force-add runtime state on this dedicated branch.
          git add -f state/
          if git diff --cached --quiet; then
            echo "No persistent state changes to commit."
          else
            git commit -m "state: $(date -u +%Y-%m-%d_%H:%M) daily pipeline [skip ci]"
            git push origin HEAD:state
            echo "Persistent state committed to state branch."
          fi

      # ── Step 16: Clean up large temp files ───────────────────────────────
      - name: Clean up temp files
        if: always()
        run: |
          rm -rf assets/videos/clips/temp_* 2>/dev/null || true
          rm -rf assets/audio/temp/ 2>/dev/null || true
          find assets/images/raw -name "*.jpg" -delete 2>/dev/null || true
          find assets/images/approved -name "*.jpg" -delete 2>/dev/null || true
          echo "Cleanup complete."
